<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Music - Steve</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen text-slate-900">
    <main class="mx-auto max-w-6xl">
      <div class="shadow-sm ring-1 ring-slate-200">
        <div class="">
          <div class="rounded-xl bg-slate-50 p-4 ring-1 ring-slate-200">
            <div class="text-sm"><span class="font-medium">Server:</span> <span id="serverInfo" class="text-slate-700">Đang kiểm tra...</span></div>
            <div class="mt-1 text-xs text-slate-500">UI này gọi API riêng qua các endpoint /api/youtube/*</div>
          </div>

          <section>
            <h2 class="mb-3 text-lg font-semibold">Tìm và phát</h2>
            <div class="flex flex-col gap-3 lg:flex-row">
              <input
                id="queryInput"
                type="text"
                placeholder="Nhập tên bài / link YouTube / videoId"
                class="w-full flex-1 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
              />
              <button
                onclick="searchTracks()"
                class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-700"
              >
                Search
              </button>
            </div>

            <div class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-5">
              <button onclick="playSelected()" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-emerald-700">Start (loa thiết bị)</button>
              <button onclick="togglePlayback()" class="rounded-lg bg-amber-500 px-3 py-2 text-sm font-medium text-white transition hover:bg-amber-600">Pause/Resume</button>
              <button onclick="stopPlayback()" class="rounded-lg bg-rose-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-rose-700">Stop</button>
              <button onclick="nextTrack()" class="rounded-lg bg-violet-600 px-3 py-2 text-sm font-medium text-white transition hover:bg-violet-700">Next</button>
              <button onclick="decreaseVolume()" class="rounded-lg bg-slate-700 px-3 py-2 text-sm font-medium text-white transition hover:bg-slate-800">Vol -</button>
              <button onclick="increaseVolume()" class="rounded-lg bg-slate-700 px-3 py-2 text-sm font-medium text-white transition hover:bg-slate-800">Vol +</button>
            </div>

            <div class="mt-3 rounded-lg border border-slate-300 bg-white p-3">
              <div class="mb-2 flex items-center justify-between text-sm">
                <span class="font-medium text-slate-700">Âm lượng</span>
                <span id="volumeValue" class="text-slate-600">--%</span>
              </div>
              <input id="volumeSlider" type="range" min="0" max="100" step="1" value="70" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-slate-200" />
            </div>

            <label class="mt-3 inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm">
              <input id="autoplayToggle" type="checkbox" checked class="h-4 w-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
              <span>Auto next</span>
            </label>
          </section>

          <section>
            <h2 class="mb-3 text-lg font-semibold">Kết quả tìm kiếm</h2>
            <div class="grid grid-cols-1 gap-4 lg:grid-cols-2">
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-600">Danh sách bài hát</label>
                <div id="resultCards" class="grid max-h-[28rem] grid-cols-1 gap-3 overflow-auto rounded-lg border border-slate-300 bg-white p-3 shadow-sm"></div>
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-600">Gợi ý</label>
                <div id="recommendationCards" class="grid max-h-[28rem] grid-cols-1 gap-3 overflow-auto rounded-lg border border-slate-300 bg-white p-3 shadow-sm"></div>
              </div>
            </div>
          </section>

          <section>
            <h2 class="mb-3 text-lg font-semibold">Đang phát</h2>
            <div class="rounded-xl bg-slate-50 p-4 text-sm ring-1 ring-slate-200" id="nowPlaying">Chưa phát bài nào</div>
            <div class="mt-2 text-xs text-slate-500">Phát bằng backend pygame ra loa thiết bị (không dùng audio trình duyệt)</div>
          </section>
        </div>
      </div>
    </main>

  <script>
    (function () {
      const historyIds = [];
      const recommends = [];
      let currentSeed = '';
      let lastSyncedVideoId = '';
      let selectedResult = null;

      async function callApi(url) {
        const res = await fetch(url);
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || res.statusText || 'Request failed');
        }
        return data;
      }

      async function callApiPost(url, body) {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body || {})
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          throw new Error(data.error || data.message || res.statusText || 'Request failed');
        }
        return data;
      }

      function addHistory(videoId) {
        const id = String(videoId || '').trim();
        if (!id) return;
        const idx = historyIds.indexOf(id);
        if (idx >= 0) historyIds.splice(idx, 1);
        historyIds.push(id);
        if (historyIds.length > 50) historyIds.shift();
      }

      function updateSelectedResultCard() {
        const cards = document.querySelectorAll('[data-result-card="1"]');
        cards.forEach((card) => {
          const cardVideoId = String(card.dataset.videoId || '').trim();
          if (selectedResult && cardVideoId && cardVideoId === selectedResult.videoId) {
            card.classList.remove('ring-slate-200', 'border-slate-200');
            card.classList.add('ring-blue-300', 'border-blue-300', 'bg-blue-50');
          } else {
            card.classList.remove('ring-blue-300', 'border-blue-300', 'bg-blue-50');
            card.classList.add('ring-slate-200', 'border-slate-200');
          }
        });
      }

      async function playTrack(track) {
        const videoId = String(track?.videoId || '').trim();
        const title = String(track?.title || 'Bài hát').trim();
        const artists = String(track?.artists || '').trim();
        if (!videoId) {
          throw new Error('Không tìm thấy videoId hợp lệ');
        }

        await callApiPost('/api/youtube/player/play', { videoId });

        addHistory(videoId);
        loadRecommendations(videoId);
        currentSeed = videoId;
        document.getElementById('nowPlaying').textContent = artists ? `${title} - ${artists}` : title;
      }

      function renderResults(items) {
        const list = document.getElementById('resultCards');
        list.innerHTML = '';
        if (!Array.isArray(items) || !items.length) {
          const empty = document.createElement('div');
          empty.className = 'rounded-lg border border-dashed border-slate-300 p-4 text-sm text-slate-500';
          empty.textContent = 'Không có kết quả';
          list.appendChild(empty);
          selectedResult = null;
          return;
        }

        if (!selectedResult) {
          const first = items[0] || {};
          selectedResult = {
            videoId: String(first.videoId || '').trim(),
            title: String(first.title || 'Bài hát').trim(),
            artists: String(first.artists || '').trim(),
            queryValue: String(first.youtubeUrl || first.videoId || first.title || '').trim(),
          };
        }

        for (const item of items) {
          const title = String(item.title || 'Bài hát').trim();
          const artists = String(item.artists || '').trim();
          const videoId = String(item.videoId || '').trim();
          const youtubeUrl = String(item.youtubeUrl || '').trim();
          const queryValue = youtubeUrl || videoId || title;
          const card = document.createElement('div');
          card.className = 'rounded-xl border border-slate-200 bg-white p-3 ring-1 ring-slate-200 transition hover:border-blue-200 hover:ring-blue-200';
          card.dataset.resultCard = '1';
          card.dataset.videoId = videoId;
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="line-clamp-2 text-sm font-semibold text-slate-900">${title}</div>
                <div class="mt-1 text-xs text-slate-500">${artists || 'Không rõ nghệ sĩ'}</div>
              </div>
              <button class="play-result-btn rounded-lg bg-emerald-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-emerald-700">Play</button>
            </div>
          `;

          card.addEventListener('click', () => {
            selectedResult = { videoId, title, artists, queryValue };
            updateSelectedResultCard();
          });

          card.querySelector('.play-result-btn').addEventListener('click', async (ev) => {
            ev.stopPropagation();
            try {
              selectedResult = { videoId, title, artists, queryValue };
              updateSelectedResultCard();
              await playTrack(selectedResult);
            } catch (e) {
              alert('Lỗi play: ' + e.message);
            }
          });

          list.appendChild(card);
        }

        updateSelectedResultCard();
      }

      async function loadServerInfo() {
        try {
          const data = await callApi('/api/youtube/status');
          document.getElementById('serverInfo').textContent = data.server || 'unknown';
        } catch (e) {
          document.getElementById('serverInfo').textContent = 'Lỗi: ' + e.message;
        }
      }

      async function loadRecommendations(videoId) {
        try {
          const history = historyIds.join(',');
          const data = await callApi('/api/youtube/recommendations?videoId=' + encodeURIComponent(videoId));
          const recs = Array.isArray(data.tracks) ? data.tracks : [];
          recommends.length = 0;
          recommends.push(...recs);
          renderRecommendations(recommends);
        } catch (e) {
          // ignore recommendation errors
        }
      }

      const renderRecommendations = (items) => {
        const list = document.getElementById('recommendationCards');
        list.innerHTML = '';
        if (!Array.isArray(items) || !items.length) {
          const empty = document.createElement('div');
          empty.className = 'rounded-lg border border-dashed border-slate-300 p-4 text-sm text-slate-500';
          empty.textContent = 'Không có gợi ý';
          list.appendChild(empty);
          return;
        }

        for (const item of items) {
          const title = String(item.title || 'Bài hát').trim();
          const artists = String(item.artists || '').trim();
          const videoId = String(item.videoId || item.id || '').trim();

          const card = document.createElement('div');
          card.className = 'rounded-xl border border-slate-200 bg-white p-3 ring-1 ring-slate-200 transition hover:border-violet-200 hover:ring-violet-200';
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <div class="line-clamp-2 text-sm font-semibold text-slate-900">${title}</div>
                <div class="mt-1 text-xs text-slate-500">${artists || 'Gợi ý cho bài đang phát'}</div>
              </div>
              <button class="play-rec-btn rounded-lg bg-violet-600 px-3 py-1.5 text-xs font-semibold text-white transition hover:bg-violet-700">Play</button>
            </div>
          `;

          card.querySelector('.play-rec-btn').addEventListener('click', async () => {
            try {
              await playTrack({ videoId, title, artists, queryValue: videoId || title });
            } catch (e) {
              alert('Lỗi play gợi ý: ' + e.message);
            }
          });

          list.appendChild(card);
        }
      };

      window.searchTracks = async function () {
        const query = document.getElementById('queryInput').value.trim();
        if (!query) return;

        try {
          const history = historyIds.join(',');
          const url = '/api/youtube/search?q=' + encodeURIComponent(query) + '&limit=20&history=' + encodeURIComponent(history);
          const data = await callApi(url);
          renderResults(data.tracks || []);
          currentSeed = query;
        } catch (e) {
          alert('Lỗi search: ' + e.message);
        }
      };

      window.playSelected = async function () {
        if (!selectedResult || !selectedResult.videoId) {
          alert('Bạn chưa chọn bài hát');
          return;
        }

        try {
          await playTrack(selectedResult);
        } catch (e) {
          alert('Lỗi play: ' + e.message);
        }
      };

      window.togglePlayback = async function () {
        try {
          const data = await callApiPost('/api/youtube/player/toggle');
          if (data && data.current_song) {
            document.getElementById('nowPlaying').textContent = data.current_song;
          }
        } catch (e) {
          alert('Lỗi toggle: ' + e.message);
        }
      };

      window.stopPlayback = async function () {
        try {
          await callApiPost('/api/youtube/player/stop');
          document.getElementById('nowPlaying').textContent = 'Đã dừng phát';
        } catch (e) {
          alert('Lỗi stop: ' + e.message);
        }
      };

      window.nextTrack = async function () {
        try {
          const data = await callApiPost('/api/youtube/player/next', {});
          const next = data.next || {};
          const videoId = String(next.videoId || '').trim();
          const title = String(next.title || 'Bài tiếp theo').trim();
          const artists = String(next.artists || '').trim();

          if (videoId) addHistory(videoId);
          currentSeed = next.youtubeUrl || next.videoId || currentSeed;
          if (videoId) {
            lastSyncedVideoId = videoId;
            loadRecommendations(videoId);
          }
          document.getElementById('nowPlaying').textContent = artists ? `${title} - ${artists}` : title;
        } catch (e) {
          alert('Lỗi next: ' + e.message);
        }
      };

      window.decreaseVolume = async function () {
        try {
          const volumeData = await callApi('/api/volume');
          const current = Number(volumeData.volume || 0);
          const next = Math.max(0, current - 10);
          const result = await callApiPost('/api/volume', { volume: next });
          const value = Number(result.volume ?? next);
          document.getElementById('volumeSlider').value = String(value);
          document.getElementById('volumeValue').textContent = value + '%';
        } catch (e) {
          alert('Lỗi giảm âm lượng: ' + e.message);
        }
      };

      window.increaseVolume = async function () {
        try {
          const volumeData = await callApi('/api/volume');
          const current = Number(volumeData.volume || 0);
          const next = Math.min(100, current + 10);
          const result = await callApiPost('/api/volume', { volume: next });
          const value = Number(result.volume ?? next);
          document.getElementById('volumeSlider').value = String(value);
          document.getElementById('volumeValue').textContent = value + '%';
        } catch (e) {
          alert('Lỗi tăng âm lượng: ' + e.message);
        }
      };

      async function loadVolume() {
        try {
          const data = await callApi('/api/volume');
          const value = Math.max(0, Math.min(100, Number(data.volume || 0)));
          document.getElementById('volumeSlider').value = String(value);
          document.getElementById('volumeValue').textContent = value + '%';
        } catch (e) {
          document.getElementById('volumeValue').textContent = '--%';
        }
      }

      document.getElementById('volumeSlider').addEventListener('change', async (ev) => {
        try {
          const value = Math.max(0, Math.min(100, Number(ev.target.value || 0)));
          const result = await callApiPost('/api/volume', { volume: value });
          const confirmed = Number(result.volume ?? value);
          ev.target.value = String(confirmed);
          document.getElementById('volumeValue').textContent = confirmed + '%';
        } catch (e) {
          alert('Lỗi đặt âm lượng: ' + e.message);
        }
      });

      document.getElementById('volumeSlider').addEventListener('input', (ev) => {
        const value = Math.max(0, Math.min(100, Number(ev.target.value || 0)));
        document.getElementById('volumeValue').textContent = value + '%';
      });

      async function syncPlayerStatus() {
        try {
          const data = await callApi('/api/youtube/player/status');
          const isPlaying = !!data.is_playing;
          const paused = !!data.paused;
          const song = String(data.current_song || '').trim();
          const currentVideoId = String(data.youtube_video_id || '').trim();
          if (song) {
            document.getElementById('nowPlaying').textContent = isPlaying
              ? (paused ? ('Tạm dừng: ' + song) : ('Đang phát: ' + song))
              : ('Chờ phát: ' + song);
          }
          if (typeof data.autoplay_enabled === 'boolean') {
            document.getElementById('autoplayToggle').checked = data.autoplay_enabled;
          }

          if (currentVideoId && currentVideoId !== lastSyncedVideoId) {
            lastSyncedVideoId = currentVideoId;
            currentSeed = currentVideoId;
            addHistory(currentVideoId);
            loadRecommendations(currentVideoId);
          }
        } catch (e) {
          // ignore periodic status errors
        }
      }

      document.getElementById('autoplayToggle').addEventListener('change', async (ev) => {
        try {
          await callApiPost('/api/youtube/player/autoplay', { enabled: !!ev.target.checked });
        } catch (e) {
          alert('Lỗi đổi autoplay: ' + e.message);
        }
      });

      loadServerInfo();
      loadVolume();
      syncPlayerStatus();
      setInterval(syncPlayerStatus, 3000);
    })();
  </script>
</body>
</html>
