<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xiaozhi Web Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#0f172a",
            coral: "#f97316",
            mint: "#14b8a6",
          },
          boxShadow: {
            lift: "0 12px 40px -12px rgba(15, 23, 42, 0.35)",
          },
          fontFamily: {
            display: ["Space Grotesk", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
        },
      },
    };
  </script>
  <style>
    .pattern-bg {
      background-image:
        radial-gradient(circle at 1px 1px, rgba(15, 23, 42, 0.12) 1px, transparent 0),
        linear-gradient(120deg, #fff6de 0%, #e8fff6 45%, #ecf8ff 100%);
      background-size: 22px 22px, auto;
    }

    .float-in {
      animation: floatIn 0.45s ease-out both;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body class="pattern-bg min-h-screen text-ink font-display">
  <div class="mx-auto w-full max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
    <header class="float-in mb-6 rounded-3xl bg-ink px-6 py-6 text-white shadow-lift">
      <p class="mb-2 inline-flex rounded-full bg-white/10 px-3 py-1 text-xs tracking-wide">Xiaozhi Control Center</p>
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Web Control Dashboard</h1>
          <p class="mt-1 text-sm text-white/80">Dieu khien AI, nhac va thiet bi ngay trong mot trang.</p>
        </div>
        <a
          href="/youtube-music"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center justify-center rounded-xl bg-coral px-4 py-2 text-sm font-semibold text-white transition hover:brightness-95"
        >
          Mo YouTube Music UI
        </a>
      </div>
    </header>

    <section class="float-in mb-6 rounded-2xl border border-white/70 bg-white/85 p-4 shadow-lift backdrop-blur sm:p-5">
      <div class="mb-3 flex items-center justify-between">
        <h2 class="text-lg font-bold">Trang thai he thong</h2>
        <span class="rounded-full bg-mint/15 px-2 py-1 text-xs font-semibold text-mint">Live</span>
      </div>
      <pre id="status" class="max-h-72 overflow-auto rounded-xl bg-ink p-4 font-mono text-xs text-slate-100">Dang tai trang thai...</pre>
    </section>

    <div class="grid grid-cols-1 gap-6 lg:grid-cols-2">
      <section class="float-in rounded-2xl border border-white/70 bg-white/85 p-5 shadow-lift backdrop-blur">
        <h2 class="mb-4 text-lg font-bold">Hoi AI</h2>
        <div class="space-y-3">
          <input id="askText" type="text" placeholder="Nhap cau hoi..." class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none ring-coral/40 transition focus:ring" />
          <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
            <button onclick="askAI()" class="rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-white transition hover:opacity-90">Gui</button>
            <button onclick="startListen()" class="rounded-xl bg-mint px-4 py-2.5 text-sm font-semibold text-white transition hover:brightness-95">Listen</button>
            <button onclick="stopListen()" class="rounded-xl bg-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-300">Stop Listen</button>
          </div>
        </div>
      </section>

      <section class="float-in rounded-2xl border border-white/70 bg-white/85 p-5 shadow-lift backdrop-blur">
        <h2 class="mb-4 text-lg font-bold">Mo nhac</h2>
        <div class="space-y-3">
          <input id="songName" type="text" placeholder="Ten bai hat" class="w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm outline-none ring-coral/40 transition focus:ring" />
          <div class="grid grid-cols-1 gap-2 sm:grid-cols-3">
            <button onclick="playMusic()" class="rounded-xl bg-coral px-4 py-2.5 text-sm font-semibold text-white transition hover:brightness-95">Mo nhac</button>
            <button onclick="toggleMusic()" class="rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-white transition hover:opacity-90">Play/Pause</button>
            <button onclick="stopMusic()" class="rounded-xl bg-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-300">Stop</button>
          </div>
        </div>
      </section>

      <section class="float-in rounded-2xl border border-white/70 bg-white/85 p-5 shadow-lift backdrop-blur lg:col-span-2">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-2">
          <h2 class="text-lg font-bold">Am luong</h2>
          <span id="volumeLabel" class="rounded-full bg-ink px-3 py-1 text-xs font-semibold text-white">70%</span>
        </div>
        <div class="grid grid-cols-2 gap-2 sm:grid-cols-5">
          <button onclick="changeVolume(-10)" class="rounded-xl bg-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-300">-10</button>
          <button onclick="changeVolume(10)" class="rounded-xl bg-slate-200 px-3 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-300">+10</button>
          <button onclick="muteVolume()" class="rounded-xl bg-ink px-3 py-2.5 text-sm font-semibold text-white transition hover:opacity-90">Mute</button>
          <button onclick="unmuteVolume()" class="rounded-xl bg-mint px-3 py-2.5 text-sm font-semibold text-white transition hover:brightness-95">Unmute</button>
          <button onclick="refreshVolume()" class="rounded-xl bg-coral px-3 py-2.5 text-sm font-semibold text-white transition hover:brightness-95">Refresh</button>
        </div>
        <div class="mt-4">
          <input id="volumeSlider" type="range" min="0" max="100" value="70" class="h-2 w-full cursor-pointer appearance-none rounded-lg bg-slate-200 accent-coral" oninput="onVolumeSliderInput(this.value)" onchange="setVolume(this.value)" />
        </div>
      </section>

      <section class="float-in rounded-2xl border border-white/70 bg-white/85 p-5 shadow-lift backdrop-blur lg:col-span-2">
        <div class="mb-3 flex flex-wrap items-end gap-2">
          <div>
            <h2 class="text-lg font-bold">Logs</h2>
            <p class="text-xs text-slate-500">Theo doi nhat ky realtime tu service.</p>
          </div>
          <div class="ml-auto flex w-full flex-wrap items-center gap-2 sm:w-auto">
            <input id="logLines" type="number" min="10" max="2000" value="200" class="w-28 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm outline-none ring-coral/40 focus:ring" />
            <button onclick="loadLogs()" class="rounded-xl bg-ink px-4 py-2 text-sm font-semibold text-white transition hover:opacity-90">Tai log</button>
            <button onclick="restartApp()" class="rounded-xl bg-coral px-4 py-2 text-sm font-semibold text-white transition hover:brightness-95">Restart ung dung</button>
          </div>
        </div>
        <pre id="logs" class="max-h-80 overflow-auto rounded-xl bg-slate-950 p-4 font-mono text-xs text-slate-200">Chua tai logs...</pre>
      </section>
    </div>
  </div>

  <div id="toast" class="pointer-events-none fixed bottom-4 right-4 z-50 hidden max-w-sm rounded-xl bg-ink px-4 py-3 text-sm text-white shadow-lift"></div>

  <script>
    (function () {
      let toastTimer = null;

      function notify(message, isError = false) {
        const toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = String(message || 'Hoan tat');
        toast.classList.remove('hidden', 'bg-ink', 'bg-red-600');
        toast.classList.add(isError ? 'bg-red-600' : 'bg-ink');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.add('hidden');
        }, 2200);
      }

      async function callApi(url, method = 'GET', body = null) {
        const options = { method, headers: { 'Content-Type': 'application/json' } };
        if (body) options.body = JSON.stringify(body);
        const res = await fetch(url, options);
        const data = await res.json().catch(() => ({ ok: false, error: 'Invalid response' }));
        if (!res.ok) throw new Error(data.error || res.statusText || 'Request failed');
        return data;
      }

      window.refreshStatus = async function () {
        try {
          const data = await callApi('/api/status');
          document.getElementById('status').innerText = JSON.stringify(data, null, 2);
          await window.refreshVolume();
        } catch (e) {
          document.getElementById('status').innerText = 'Loi status: ' + e.message;
        }
      };

      window.onVolumeSliderInput = function (value) {
        document.getElementById('volumeLabel').innerText = String(value) + '%';
      };

      window.refreshVolume = async function () {
        try {
          const data = await callApi('/api/volume');
          if (typeof data.volume === 'number') {
            const volume = Math.max(0, Math.min(100, Math.round(data.volume)));
            document.getElementById('volumeSlider').value = volume;
            window.onVolumeSliderInput(volume);
          }
        } catch (e) {
          // Khong chan UI neu thiet bi khong ho tro dieu khien am luong
        }
      };

      window.setVolume = async function (value) {
        const volume = Math.max(0, Math.min(100, Number(value)));
        try {
          const data = await callApi('/api/volume', 'POST', { volume });
          if (typeof data.volume === 'number') {
            const realVolume = Math.max(0, Math.min(100, Math.round(data.volume)));
            document.getElementById('volumeSlider').value = realVolume;
            window.onVolumeSliderInput(realVolume);
          } else {
            window.onVolumeSliderInput(volume);
          }
        } catch (e) {
          notify('Loi chinh am luong: ' + e.message, true);
          await window.refreshVolume();
        }
      };

      window.changeVolume = async function (delta) {
        const slider = document.getElementById('volumeSlider');
        const current = Number(slider.value || 0);
        const target = Math.max(0, Math.min(100, current + Number(delta || 0)));
        slider.value = target;
        window.onVolumeSliderInput(target);
        await window.setVolume(target);
      };

      window.muteVolume = async function () {
        try {
          const data = await callApi('/api/volume/mute', 'POST');
          if (typeof data.volume === 'number') {
            document.getElementById('volumeSlider').value = data.volume;
            window.onVolumeSliderInput(data.volume);
          }
        } catch (e) {
          notify('Loi mute: ' + e.message, true);
        }
      };

      window.unmuteVolume = async function () {
        try {
          const data = await callApi('/api/volume/unmute', 'POST');
          if (typeof data.volume === 'number') {
            document.getElementById('volumeSlider').value = data.volume;
            window.onVolumeSliderInput(data.volume);
          }
        } catch (e) {
          notify('Loi unmute: ' + e.message, true);
        }
      };

      window.askAI = async function () {
        const text = document.getElementById('askText').value.trim();
        if (!text) return;
        try {
          const data = await callApi('/api/ask', 'POST', { text });
          notify(data.message || 'Da gui cau hoi');
        } catch (e) {
          notify('Loi hoi AI: ' + e.message, true);
        }
      };

      window.startListen = async function () {
        try {
          const data = await callApi('/api/listen/start', 'POST');
          notify(data.message || 'Da bat dau lang nghe');
          await window.refreshStatus();
        } catch (e) {
          notify('Loi start listen: ' + e.message, true);
        }
      };

      window.stopListen = async function () {
        try {
          const data = await callApi('/api/listen/stop', 'POST');
          notify(data.message || 'Da dung lang nghe');
          await window.refreshStatus();
        } catch (e) {
          notify('Loi stop listen: ' + e.message, true);
        }
      };

      window.playMusic = async function () {
        const song_name = document.getElementById('songName').value.trim();
        if (!song_name) return;
        try {
          const data = await callApi('/api/music/play', 'POST', { song_name });
          notify(data.message || 'Da xu ly mo nhac');
          await window.refreshStatus();
        } catch (e) {
          notify('Loi mo nhac: ' + e.message, true);
        }
      };

      window.toggleMusic = async function () {
        try {
          const data = await callApi('/api/music/toggle', 'POST');
          notify(data.message || 'Da toggle nhac');
          await window.refreshStatus();
        } catch (e) {
          notify('Loi toggle nhac: ' + e.message, true);
        }
      };

      window.stopMusic = async function () {
        try {
          const data = await callApi('/api/music/stop', 'POST');
          notify(data.message || 'Da dung nhac');
          await window.refreshStatus();
        } catch (e) {
          notify('Loi dung nhac: ' + e.message, true);
        }
      };

      window.loadLogs = async function () {
        const lines = Number(document.getElementById('logLines').value || 200);
        try {
          const data = await callApi('/api/logs?lines=' + encodeURIComponent(lines));
          document.getElementById('logs').innerText = (data.lines || []).join('\n');
        } catch (e) {
          document.getElementById('logs').innerText = 'Loi tai logs: ' + e.message;
        }
      };

      window.restartApp = async function () {
        if (!confirm('Ban chac chan muon restart ung dung?')) return;
        try {
          const data = await callApi('/api/restart', 'POST');
          notify(data.message || 'Dang restart');
        } catch (e) {
          notify('Loi restart: ' + e.message, true);
        }
      };

      window.refreshStatus();
      window.refreshVolume();
      window.loadLogs();
      setInterval(window.refreshStatus, 4000);
    })();
  </script>
</body>
</html>
